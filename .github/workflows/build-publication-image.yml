name: Build optimized publication enrichment image

on:
  push:
    branches: [main]
    paths:
      - "backend/Dockerfile"
      - "r/enrichment_publication.R"
      - "r/build_semantic_cache.R"
      - "modules/reference_validation.py"
      - "scripts/validate_publication_job.py"
      - "scripts/compare_publication_outputs.py"
      - ".github/workflows/build-publication-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publication-image-main
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/peterdatascientia/network-pharmacology-publication:validated

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build optimized publication candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=publication-image-optimized
          cache-to: type=gha,mode=max,scope=publication-image-optimized

      - name: Prepare exact 32-gene reference request
        run: |
          rm -rf job_input job_output_uncached job_output_cached
          mkdir -p job_input job_output_uncached job_output_cached
          cp validation/egcg_risi_shared_targets.txt job_input/foreground_symbols.txt
          python - <<'PY'
          import json
          from pathlib import Path
          genes = [
              x.strip()
              for x in Path("job_input/foreground_symbols.txt").read_text().splitlines()
              if x.strip()
          ]
          Path("job_input/request.json").write_text(json.dumps({
              "request_id": "optimized-image-reference-gate",
              "targets": genes,
              "taxon_id": 9606,
              "organism": "human",
              "background_mode": "default",
              "custom_background": None,
          }, indent=2))
          PY

      - name: Run uncached scientific baseline
        run: |
          docker run --rm \
            -e PUBLICATION_USE_SEMDATA_CACHE=0 \
            -v "$PWD/job_input:/job_input:ro" \
            -v "$PWD/job_output_uncached:/job_output" \
            "$IMAGE_NAME" \
            Rscript /app/r/enrichment_publication.R \
              /job_input/foreground_symbols.txt \
              /job_output \
              human \
              default \
              NONE

      - name: Run optimized cached enrichment
        run: |
          docker run --rm \
            -e PUBLICATION_USE_SEMDATA_CACHE=1 \
            -v "$PWD/job_input:/job_input:ro" \
            -v "$PWD/job_output_cached:/job_output" \
            "$IMAGE_NAME" \
            Rscript /app/r/enrichment_publication.R \
              /job_input/foreground_symbols.txt \
              /job_output \
              human \
              default \
              NONE

      - name: Prove cached and uncached scientific outputs are equivalent
        run: |
          python scripts/compare_publication_outputs.py \
            job_output_uncached \
            job_output_cached

      - name: Validate exact publication reference
        run: |
          python scripts/validate_publication_job.py \
            job_input/request.json \
            job_output_cached/summary.json

      - name: Show validated publication counts
        run: |
          python - <<'PY'
          import json
          x=json.load(open("job_output_cached/summary.json"))
          print("Versions:", x["versions"])
          print("Counts:", x["counts"])
          print("Semantic cache:", x.get("go_semantic_cache"))
          PY

      - name: Publish optimized parity-validated image
        run: docker push "$IMAGE_NAME"
