name: Build validated R analysis image

on:
  push:
    branches: [main]
    paths:
      - "backend/Dockerfile"
      - "r/enrichment_publication.R"
      - "r/network_centrality.R"
      - "modules/reference_validation.py"
      - "scripts/validate_publication_job.py"
      - "validation/egcg_risi_string_v12_network.tsv"
      - "validation/validate_r_network_reference.py"
      - ".github/workflows/build-publication-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: validated-r-analysis-image-main
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/peterdatascientia/network-pharmacology-publication:validated

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate R analysis image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=publication-image
          cache-to: type=gha,mode=max,scope=publication-image

      - name: Verify exact R and igraph versions
        run: |
          docker run --rm "$IMAGE_NAME" Rscript -e '
            cat(R.version.string, "\n")
            cat("igraph ", as.character(packageVersion("igraph")), "\n")
            stopifnot(grepl("4.6.1", R.version.string))
            stopifnot(as.character(packageVersion("igraph")) == "2.3.4")
          '

      - name: Run exact 32-gene publication parity gate
        run: |
          rm -rf job_input job_output
          mkdir -p job_input job_output
          cp validation/egcg_risi_shared_targets.txt job_input/foreground_symbols.txt
          python - <<'PY'
          import json
          from pathlib import Path
          genes = [
              x.strip()
              for x in Path("job_input/foreground_symbols.txt").read_text().splitlines()
              if x.strip()
          ]
          Path("job_input/request.json").write_text(json.dumps({
              "request_id": "image-build-reference-gate",
              "targets": genes,
              "taxon_id": 9606,
              "organism": "human",
              "background_mode": "default",
              "custom_background": None,
          }, indent=2))
          PY

          docker run --rm \
            -v "$PWD/job_input:/job_input:ro" \
            -v "$PWD/job_output:/job_output" \
            "$IMAGE_NAME" \
            Rscript /app/r/enrichment_publication.R \
              /job_input/foreground_symbols.txt \
              /job_output \
              human \
              default \
              NONE

          python scripts/validate_publication_job.py \
            job_input/request.json \
            job_output/summary.json

      - name: Run frozen R igraph centrality parity gate
        run: |
          rm -rf centrality_reference_output
          mkdir -p centrality_reference_output

          docker run --rm \
            -v "$PWD/validation:/validation:ro" \
            -v "$PWD/centrality_reference_output:/centrality_output" \
            "$IMAGE_NAME" \
            Rscript /app/r/network_centrality.R \
              /validation/egcg_risi_string_v12_network.tsv \
              /centrality_output \
              10

          python validation/validate_r_network_reference.py \
            centrality_reference_output

      - name: Show validated reference results
        run: |
          python - <<'PY'
          import json
          pub = json.load(open("job_output/summary.json"))
          cent = json.load(open("centrality_reference_output/centrality_summary.json"))
          print("Publication versions:", pub["versions"])
          print("Publication counts:", pub["counts"])
          print("Centrality engine:", cent["engine"])
          print("Centrality nodes/edges/hubs:", cent["nodes"], cent["edges"], cent["hub_count"])
          PY

      - name: Publish parity-validated image
        run: docker push "$IMAGE_NAME"
