name: Validate and deploy Modal publication backend

on:
  push:
    branches:
      - backend-publication-enrichment
  workflow_dispatch:

concurrency:
  group: modal-publication-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-4gb:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Build exact publication backend image
        run: docker build -f backend/Dockerfile -t publication-backend:test .

      - name: Verify exact R package versions
        run: |
          docker run --rm publication-backend:test Rscript -e 'cat(R.version.string, "\n"); cat("clusterProfiler ", as.character(packageVersion("clusterProfiler")), "\n"); cat("ReactomePA ", as.character(packageVersion("ReactomePA")), "\n"); cat("org.Hs.eg.db ", as.character(packageVersion("org.Hs.eg.db")), "\n")'

      - name: Start backend with Modal target memory
        run: |
          docker run -d --name publication-backend \
            --memory=4g --memory-swap=4g \
            -p 10000:10000 \
            publication-backend:test
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:10000/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs publication-backend
          exit 1

      - name: Run exact 32-gene EGCG parity gate
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          targets = [
              x.strip()
              for x in open("validation/egcg_risi_shared_targets.txt")
              if x.strip()
          ]
          payload = json.dumps({
              "targets": targets,
              "taxon_id": 9606,
              "background_mode": "default",
              "custom_background": None,
          }).encode()

          req = urllib.request.Request(
              "http://127.0.0.1:10000/enrich",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=600) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              print(
                  "HTTP_ERROR_BODY:",
                  exc.read().decode("utf-8", errors="replace"),
              )
              raise

          counts = data["summary"]["counts"]
          expected = {
              "go_bp_raw": 1432,
              "go_bp_reduced": 49,
              "go_cc_raw": 23,
              "go_cc_reduced": 17,
              "go_mf_raw": 54,
              "go_mf_reduced": 26,
              "reactome_raw": 276,
              "reactome_reduced": 91,
          }
          print("Observed:", counts)
          assert counts == expected, (counts, expected)
          print("EXACT_PARITY_OK")
          PY

      - name: Inspect container state
        if: always()
        run: |
          docker stats --no-stream publication-backend || true
          docker inspect publication-backend --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Status={{.State.Status}}' || true
          docker logs publication-backend | tail -200 || true

  modal-definition:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Modal definition
        run: |
          python -m pip install --upgrade pip
          pip install "modal>=1.3,<2"
          python -m py_compile backend/modal_app.py backend/app.py
          python - <<'PY'
          import backend.modal_app
          print("MODAL_DEFINITION_OK")
          PY

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate-4gb, modal-definition]
    runs-on: ubuntu-latest
    environment: modal-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: pip install "modal>=1.3,<2"

      - name: Deploy Modal backend
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy backend/modal_app.py --name network-pharmacology-publication
