name: Validate publication backend

on:
  push:
    branches:
      - publication-backend
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build exact Bioconductor backend
        run: docker build -f backend/Dockerfile -t publication-backend:test .

      - name: Start backend with 4 GB memory limit
        run: |
          docker run -d \
            --name publication-backend \
            --memory=512m \
            --memory-swap=512m \
            --cpus=1 \
            -p 10000:10000 \
            -e BACKEND_API_TOKEN=test-token \
            -e ANALYSIS_TIMEOUT_SECONDS=1200 \
            publication-backend:test

      - name: Install test client dependency
        run: python -m pip install requests

      - name: Run API parity test
        env:
          BACKEND_TEST_URL: http://127.0.0.1:10000
          BACKEND_API_TOKEN: test-token
        run: python validation/test_backend_api.py

      - name: Show backend logs
        if: always()
        run: docker logs publication-backend || true

      - name: Show container resource status
        if: always()
        run: docker inspect publication-backend --format='{{json .State}}' || true
