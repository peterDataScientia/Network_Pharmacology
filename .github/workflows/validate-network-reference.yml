name: Validate network reference

on:
  push:
    branches: [main]
    paths:
      - "modules/hub_consensus_v2.py"
      - "modules/reference_validation.py"
      - "validation/egcg_risi_string_v12_network.tsv"
      - "validation/validate_network_reference.py"
      - ".github/workflows/validate-network-reference.yml"
  pull_request:
    paths:
      - "modules/hub_consensus_v2.py"
      - "modules/reference_validation.py"
      - "validation/egcg_risi_string_v12_network.tsv"
      - "validation/validate_network_reference.py"
      - ".github/workflows/validate-network-reference.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas networkx
      - run: python validation/validate_network_reference.py
