name: Test Conda publication runtime

on:
  push:
    branches:
      - test-conda-publication-runtime
  workflow_dispatch:

jobs:
  validate-conda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash

      - name: Show versions
        shell: bash -el {0}
        run: |
          python --version
          Rscript -e 'cat(R.version.string, "\n"); cat("clusterProfiler ", as.character(packageVersion("clusterProfiler")), "\n"); cat("ReactomePA ", as.character(packageVersion("ReactomePA")), "\n"); cat("org.Hs.eg.db ", as.character(packageVersion("org.Hs.eg.db")), "\n")'

      - name: Python syntax check
        shell: bash -el {0}
        run: |
          python -m py_compile app.py modules/publication_enrichment.py modules/publication_ui.py modules/publication_plots.py validation/run_egcg_validation.py

      - name: Run EGCG parity validation
        shell: bash -el {0}
        env:
          PUBLICATION_R_LIB: ""
        run: python validation/run_egcg_validation.py

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conda-egcg-validation
          path: validation/outputs/
          if-no-files-found: warn
