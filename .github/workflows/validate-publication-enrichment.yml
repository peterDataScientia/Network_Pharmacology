name: Validate publication enrichment

on:
  push:
    branches:
      - dev-publication-enrichment
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile             modules/hub_consensus_v2.py             modules/publication_enrichment.py             modules/publication_plots.py             publication_enrichment_dev.py             validation/run_egcg_validation.py

      - name: Install R/Bioconductor dependencies
        run: Rscript scripts/install_publication_enrichment.R

      - name: Run EGCG validation
        run: python validation/run_egcg_validation.py

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egcg-publication-enrichment-validation
          path: validation/outputs/
          if-no-files-found: warn
