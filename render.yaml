services:
  - type: web
    name: network-pharmacology-enrichment
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: BACKEND_API_TOKEN
        sync: false
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "1200"
      - key: MAX_TARGETS
        value: "500"
      - key: MAX_BACKGROUND
        value: "100000"
